# LedgerX API — Cloudflare Worker (Hono). Phase 3 scaffold.
name = "ledgerx-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# CORS allow-list, comma-separated. An entry may use a `*` wildcard label
# (one or more DNS labels). Edit here to add origins — no code change needed.
# Add your production custom domain here later if you use one.
[vars]
CORS_ORIGINS = "http://localhost:5173,https://ledgerx.pages.dev,https://*.ledgerx.pages.dev"

# Supabase — both are PUBLIC values (project URL + anon/publishable key). RLS is
# the real boundary; the service_role key must NEVER go here.
SUPABASE_URL = "https://wdkwwbszbydciywexmnn.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_RfLi72zmr1A8vBNZG3xrFg_K8PKzDGW"

# R2 bucket for trade screenshots (Phase 10). `wrangler dev` simulates it locally;
# create the real bucket once with: npx wrangler r2 bucket create ledgerx-screenshots
[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "ledgerx-screenshots"
